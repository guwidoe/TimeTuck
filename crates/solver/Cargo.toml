[package]
autotests = false
name = "timetuck"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "An independent constraint optimization solver, implemented from scratch in Rust"

[lints]
workspace = true

[dependencies]
num-bigint = "=0.5.1"
roxmltree = "=0.21.1"
serde_json = { version = "=1.0.151", features = ["float_roundtrip", "arbitrary_precision"] }
aes = { version = "=0.8.4", features = ["zeroize"] }
cbc = { version = "=0.1.2", features = ["alloc", "block-padding"] }
sha2 = "=0.10.9"
base64 = "=0.22.1"
zeroize = "=1.8.2"
getrandom = "=0.2.16"

