name: Quick checks
# Hosted CI runs only checks that finish in about a minute without building the
# solver. The full gate (strict Clippy, every Rust test target, doctests) needs
# about 13 GB of memory and tens of minutes, so it runs on local hardware with
# `bash scripts/check.sh`; see CONTRIBUTING.md.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: quick-checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quick:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: rustup toolchain install
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Install pinned history test tool
        run: |
          curl --fail --silent --show-error --location \
            https://raw.githubusercontent.com/newren/git-filter-repo/6f79afc8c90c592a3052e6cc53c2ca8907515bca/git-filter-repo \
            --output "$RUNNER_TEMP/git-filter-repo"
          echo "67447413e273fc76809289111748870b6f6072f08b17efe94863a92d810b7d94  $RUNNER_TEMP/git-filter-repo" | sha256sum --check
          echo "PUBLIC_HISTORY_FILTER_TOOL=$RUNNER_TEMP/git-filter-repo" >> "$GITHUB_ENV"
      - name: Script tests
        run: |
          for test in scripts/test_*.py; do
            python3 -m unittest discover -s scripts -p "$(basename "$test")" || exit 1
          done

  upstream-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Verify pinned reference and inventory test sources
        run: python3 scripts/upstream_inventory.py
